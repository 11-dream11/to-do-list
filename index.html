<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1><i class="fas fa-tasks"></i> My To-Do List</h1>
                <p class="subtitle">Organize your day efficiently</p>
            </div>
            <div class="input-container">
                <input type="text" id="taskInput" placeholder="What needs to be done?">
                <button id="addTaskBtn"><i class="fas fa-plus"></i> Add</button>
            </div>
        </header>
        
        <div class="app-content">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            
            <div class="task-list-container">
                <ul id="taskList"></ul>
            </div>
            
            <div class="task-stats">
                <span id="tasksLeft">0 tasks left</span>
                <button id="clearCompleted">Clear Completed</button>
            </div>
        </div>
    </div>

    <div class="empty-state" id="emptyState">
        <img src="https://via.placeholder.com/150/e0e0e0/969696?text=✓" alt="No tasks" class="empty-state-img">
        <h3>No tasks yet!</h3>
        <p>Add your first task using the input above</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
